services:
  web:
    container_name: pokedex-next-frontend-production
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      args:
        NODE_VERSION: '24.12.0'
    image: pokedex-next-frontend:production
    restart: unless-stopped
    env_file:
      - ../../.env.production
    ports:
      - '3000:3000'
